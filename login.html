<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Masuk - Tubeflix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">TUBEFLIX</a>
    </header>

    <div class="form-wrapper">
        <div class="form-box">
            <h2>Masuk</h2>
            <form action="browse.html">
                <div class="input-group">
                    <input type="email" placeholder="Email atau nomor telepon" required>
                    <input type="password" placeholder="Sandi" required>
                </div>
                <br>
                <button type="submit" class="btn-red" style="width: 100%; padding: 15px;">Masuk</button>
                
                <div class="form-help">
                    <label><input type="checkbox"> Ingat saya</label>
                    <a href="#" style="color:#b3b3b3;">Perlu bantuan?</a>
                </div>

                <div style="margin-top: 50px; color: #737373;">
                    Baru di Tubeflix? <a href="signup.html" style="color: white;">Daftar sekarang.</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
