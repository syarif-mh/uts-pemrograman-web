<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Selesaikan Pendaftaran - Tubeflix</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .signup-body { background: white; color: #333; }
        .signup-nav { border-bottom: 1px solid #e6e6e6; background: white; }
        .signup-nav .logo { color: var(--primary-color); text-decoration: none; font-size: 2.5rem; font-weight: bold;}
        .signup-container { max-width: 440px; margin: 20px auto; padding: 20px 4%; }
        
        /* Ikon Kartu Kredit Sederhana dengan CSS */
        .cc-icons { font-size: 0.8rem; color: #999; border: 1px solid #ccc; padding: 5px; display: inline-block; border-radius: 4px; margin-bottom: 10px;}
    </style>
</head>
<body class="signup-body">
    <nav class="signup-nav" style="padding: 20px 4%; display:flex; justify-content:space-between; align-items: center;">
        <a href="index.html" class="logo">TUBEFLIX</a>
        <a href="login.html" style="color:#333; font-weight:bold; font-size: 1.1rem; text-decoration:none;">Masuk</a>
    </nav>

    <div class="signup-container">
        <p style="font-size: 0.8rem; color: #666;">LANGKAH 2 DARI 3</p>
        <h2 style="font-size: 2rem; margin: 5px 0 15px 0;">Siapkan akun Anda</h2>
        <p style="margin-bottom: 25px; color: #333;">Lengkapi data diri dan metode pembayaran untuk mulai menonton.</p>

        <form action="browse.html">
            
            <div class="section-title">Informasi Pribadi</div>
            
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Contoh: Budi Santoso" required>

            <label>Email</label>
            <input type="email" placeholder="nama@email.com" required>

            <label>Password</label>
            <input type="password" placeholder="Minimal 8 karakter" required>

            <div class="form-row">
                <div class="form-col">
                    <label>Tanggal Lahir</label>
                    <input type="date" required style="color: #666;"> 
                </div>
                <div class="form-col">
                    <label>Jenis Kelamin</label>
                    <select required>
                        <option value="">Pilih...</option>
                        <option value="pria">Pria</option>
                        <option value="wanita">Wanita</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">Pilih Paket Anda</div>
                <p class="helper-text">Anda bisa menurunkan atau menaikkan paket kapan saja.</p>
                
                <label>Kategori Paket</label>
                <select required>
                    <option value="basic">Basic (Rp 65.000/bulan) - 720p</option>
                    <option value="standard">Standard (Rp 120.000/bulan) - 1080p</option>
                    <option value="premium" selected>Premium (Rp 186.000/bulan) - 4K+HDR</option>
                </select>
            </div>

            <div class="form-section">
                <div class="section-title">Atur Pembayaran</div>
                <div class="cc-icons">VISA / MASTERCARD / BCA</div>

                <label>Nomor Kartu</label>
                <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required>

                <div class="form-row">
                    <div class="form-col">
                        <label>Tgl Kadaluarsa</label>
                        <input type="text" placeholder="BB/TT" maxlength="5" required>
                    </div>
                    <div class="form-col">
                        <label>CVV</label>
                        <input type="text" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                
                <label>Nama di Kartu</label>
                <input type="text" placeholder="Nama Pemilik Kartu" required>
            </div>

            <div style="margin: 20px 0; font-size: 0.85rem; color: #737373;">
                <label style="font-weight: normal; display: flex; gap: 10px; align-items: flex-start;">
                    <input type="checkbox" required style="width: 20px; margin: 0;">
                    <span>Saya setuju dengan Syarat Penggunaan dan Kebijakan Privasi Tubeflix.</span>
                </label>
            </div>

            <button type="submit" class="btn-red" style="width: 100%; padding: 18px; font-size: 1.2rem; margin-top: 10px;">Mulai Keanggotaan</button>
        </form>
    </div>
</body>
</html>
