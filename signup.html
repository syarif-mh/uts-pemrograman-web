<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mulai Berlangganan - Tubeflix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">TUBEFLIX</a>
        <a href="login.html" class="btn-red">Masuk</a>
    </header>

    <div class="form-wrapper">
        <div class="form-box">
            <h2>Daftar</h2>
            <form action="browse.html">
                
                <div class="input-group">
                    
                    <input type="nama-lengkap" placeholder="Nama Lengkap" required>
                    <input type="email" placeholder="Email" required>

                    <div class="form-row">
                        <div class="form-col">
                            <label class="input-label">Tanggal Lahir</label>
                            <input type="date" required class="dark-input">
                        </div>
                        <div class="form-col">
                            <label class="input-label">Jenis Kelamin</label>
                            <select required class="dark-input">
                                <option value="" disabled selected>Pilih...</option>
                                <option value="pria">Pria</option>
                                <option value="wanita">Wanita</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="input-label">Pilihan Paket</label>
                        <select required class="dark-input">
                            <option value="" disabled selected>Pilih Paket Langganan</option>
                            <option value="mobile">Ponsel - Rp 54.000 (480p)</option>
                            <option value="basic">Dasar - Rp 120.000 (720p)</option>
                            <option value="standard">Standar - Rp 153.000 (1080p)</option>
                            <option value="premium">Premium - Rp 186.000 (4K)</option>
                        </select>
                    </div>

                </div>

                <br>
                <button type="submit" class="btn-red" style="width: 100%; padding: 15px; margin-top: 10px;">Daftar Sekarang</button>
                
                <div style="margin-top: 20px; color: #737373;">
                    Sudah punya akun? <a href="login.html" style="color: white;">Masuk di sini.</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
